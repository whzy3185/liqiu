[project]
name = "granular-research-lab"
version = "0.1.0"
description = "Evidence-first experimentation infrastructure for granular computing research"
requires-python = ">=3.9"

[project.optional-dependencies]
ml = [
  "numpy>=1.26,<3",
  "pandas>=2,<3",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "kneed>=0.8,<1",
  "psutil>=5.9,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
